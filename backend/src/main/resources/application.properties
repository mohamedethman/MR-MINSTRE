# Optional local overrides. Put private values in environment variables.
spring.config.import=optional:file:./config/application.properties
spring.application.name=Domaines
server.port=${SERVER_PORT:8090}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/domaine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:domaine}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:domaines-local-dev}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=${APP_MEDIA_STORAGE_PATH:./assets}/profiles
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.error.log-path=${APP_MEDIA_STORAGE_PATH:./assets/logs}
ticket.log.path=${APP_MEDIA_STORAGE_PATH:./assets/logs}
jwt.secret=${JWT_SECRET:DomainesLocalDevOnly_ChangeForRealDeploy_2026_}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.table-check=actualites_categories
app.seed.sql-path=file:./config/seed-data.sql
app.media.storage-path=${APP_MEDIA_STORAGE_PATH:./assets}
