services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domaine
      POSTGRES_USER: domaine
      POSTGRES_PASSWORD: ${DB_PASSWORD:-domaines-local-dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domaine -d domaine"]
      interval: 5s
      timeout: 5s
      retries: 10

  domaines-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/domaine
      SPRING_DATASOURCE_USERNAME: domaine
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-domaines-local-dev}
      JWT_SECRET: ${JWT_SECRET:-DomainesLocalDevOnly_ChangeForRealDeploy_2026_}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_MEDIA_STORAGE_PATH: /app/assets
    volumes:
      - ./assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
